[project]
name = "element-chat"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["mypy>=2.0", "pytest>=9.0", "ruff>=0.17"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# `select`, not `extend-select`, so a new ruff default cannot add rules.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["deploy.py", "element_chat", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["integration: needs network access"]
